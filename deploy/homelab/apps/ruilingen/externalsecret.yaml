# ruilingen-app Secret, synced from OpenBao secret/ruilingen/app. Keys:
#   SESSION_SECRET  required. Random, >= 32 chars (openssl rand -hex 32).
#                   Changing it logs EVERYONE out, and people without an email can't get back
#                   in on their own (an admin then makes them a link). Don't rotate casually.
#   PLANNING_EMAIL  the real planning address (kept out of both public repos)
#   Only when mail is enabled (see deployment.yaml):
#   SMTP_USERNAME   mail provider SMTP login (Resend: "resend"; Brevo: your SMTP login)
#   SMTP_PASSWORD   mail provider SMTP key
#   ADMIN_EMAILS    comma separated, made admin at startup
# The app reads these only at start: after a change, force-sync and restart:
#   kubectl -n ruilingen annotate externalsecret ruilingen-app force-sync=$(date +%s) --overwrite
#   kubectl -n ruilingen rollout restart deploy/ruilingen
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ruilingen-app
  namespace: ruilingen
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ruilingen-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ruilingen/app
