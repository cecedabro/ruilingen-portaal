# Ruilingen (shift swap board), public at https://ruilingen.app through the Cloudflare tunnel.
# Source + image: https://github.com/cecedabro/ruilingen-portaal
# Exactly one replica, Recreate: the database is a SQLite file on a RWO Longhorn volume.
# New version: Flux image automation (apps/flux/image-automation.yaml) bumps the image line below
# to every new RELEASE (vX.Y.Z git tag in the app repo -> image tag X.Y.Z) and commits that here.
# Main builds don't deploy. Keep the $imagepolicy marker on the image line.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruilingen
  namespace: ruilingen
  labels:
    app: ruilingen
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ruilingen
  template:
    metadata:
      labels:
        app: ruilingen
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ruilingen
          image: ghcr.io/cecedabro/ruilingen-portaal:0.2.0 # {"$imagepolicy": "flux-system:ruilingen"}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: BASE_URL
              value: https://ruilingen.app
            - name: DATABASE_URL
              value: sqlite:////data/ruilingen.db
            # Mail is optional: without it people join via the group link with just a name,
            # and email login/notifications are hidden. To enable: set "smtp", uncomment the
            # SMTP_* lines and put SMTP_USERNAME/SMTP_PASSWORD in OpenBao.
            - name: MAIL_BACKEND
              value: none
              # - name: MAIL_FROM
              #   value: Ruilingen <noreply@ruilingen.app>
              # - name: SMTP_HOST
              #   value: smtp.resend.com
              # - name: SMTP_PORT
              #   value: "587"
          envFrom:
            - secretRef:
                name: ruilingen-app
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ruilingen-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ruilingen
  namespace: ruilingen
  labels:
    app: ruilingen
spec:
  selector:
    app: ruilingen
  ports:
    - name: http
      port: 80
      targetPort: http
