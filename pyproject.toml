[project]
name = "ruilingen-portaal"
version = "0.1.0"
description = "Shift swapping board for front-of-house colleagues"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",  # imported directly (sessions, gzip, static files)
    "uvicorn[standard]==0.34.2",
    "jinja2==3.1.6",
    "sqlalchemy==2.0.40",
    "alembic==1.15.2",
    "pydantic-settings==2.9.1",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.11.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]
