{% extends "base.html" %}
{% block title %}Check je mail · {{ settings.app_name }}{% endblock %}
{% block content %}
<div class="form narrow">
  <h2>Check je mail</h2>
  <p>Als <b>{{ email }}</b> bij een account hoort, staat er een inloglink in je inbox.</p>
  {% if dev_link %}<p class="flash ok">Ontwikkelmodus: <a href="{{ dev_link }}">{{ dev_link }}</a></p>{% endif %}
</div>
{% endblock %}
