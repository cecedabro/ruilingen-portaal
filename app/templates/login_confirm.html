{% extends "base.html" %}
{% block title %}Inloggen · {{ settings.app_name }}{% endblock %}
{% block content %}
<div class="form narrow">
{% if valid %}
  <h2>Hoi {{ name }}</h2>
  <form method="post">
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary" type="submit">Inloggen op dit apparaat</button>
  </form>
{% else %}
  <h2>Deze link werkt niet meer</h2>
  <p>Hij is verlopen of al gebruikt.</p>
{% endif %}
</div>
{% endblock %}
