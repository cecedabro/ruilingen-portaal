{% extends "base.html" %}
{% block title %}Meldingen · {{ settings.app_name }}{% endblock %}
{% block content %}
<div class="list">
{% for n in items %}
  <a class="notif{{ ' unread' if n.id in unread_ids }}" href="{{ n.link }}">{{ n.text }}<span class="meta mono">{{ stamp(n.created_at) }}</span></a>
{% else %}
  <div class="empty">Geen meldingen.</div>
{% endfor %}
</div>
{% endblock %}
