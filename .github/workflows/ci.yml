# Tests on every push/PR. On main and on version tags it also builds the image and pushes it to
# ghcr.io/cecedabro/ruilingen-portaal:
#   push to main  -> :main, :sha-<short> and :main-<YYYYMMDDHHmmss>-<short> (sortable, for Flux)
#   tag v1.2.3    -> :1.2.3, :1.2 and :latest   (these are what the homelab deploys)
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Migrations match the models
        run: |
          DATABASE_URL=sqlite:///./ci.db alembic upgrade head
          DATABASE_URL=sqlite:///./ci.db alembic check

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=main-{{date 'YYYYMMDDHHmmss'}}-{{sha}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
